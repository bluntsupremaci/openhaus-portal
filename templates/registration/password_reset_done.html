{% extends "base.html" %}

{% block title %}Password Reset Sent - OpenHaus{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow">
            <div class="card-body text-center p-5">
                <h4>Check Your Email</h4>
                <p class="lead">
                    We've emailed you instructions for resetting your password.
                </p>
                <p class="text-muted">
                    If you don't receive the email soon, please check your spam folder.
                </p>
                <a href="{% url 'accounts:login' %}" class="btn btn-primary mt-3">Back to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
